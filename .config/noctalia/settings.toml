config_version = 13

[bar.default]
background_opacity = 0.74999998323619366
center = [ "workspaces" ]
end = [
    "media",
    "notifications",
    "clipboard",
    "wallpaper",
    "volume",
    "brightness",
    "battery",
    "tray",
    "control-center",
    "session"
]
margin_edge = 3
margin_ends = 3
position = "right"
scale = 1.5000000149011612
start = [ "launcher", "clock" ]

[brightness]
enable_ddcutil = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@DP-3" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-3"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1258.0
    output = "DP-3"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-3".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1258.0
    output = "HDMI-A-1"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell.panel]
clipboard_placement = "attached"
clipboard_position = "auto"
control_center_position = "bottom_right"
open_near_click_clipboard = true
open_near_click_control_center = true
open_near_click_session = true
open_near_click_wallpaper = true
polkit_placement = "attached"
polkit_position = "auto"

[theme]
builtin = "Catppuccin"

[wallpaper]
transition = [ "fade" ]

    [wallpaper.automation]
    enabled = true

[widget.network]
show_label = false

[widget.tray]
drawer = true

[widget.workspaces]
empty_color = "#CDD6F4"
focused_output_only = true
occupied_color = "#CDD6F4"
